version: 2

models:
  - name: fact_interest
    description: "Gold layer fact mart associating many-to-many relationship of responses to ministries"
    columns:
      - name: response_id
        data_type: string
        description: '{{ doc("response_id") }}'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_responses')
                field: response_id

      - name: ministry_id
        data_type: string
        description: '{{ doc("ministry_id") }}'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ministry')
                field: ministry_id

